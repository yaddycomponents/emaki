name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  frame-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Remotion downloads its own headless shell on first render.
      # Goldens are regenerated on the runner, then re-rendered and diffed:
      # this proves every block × theme × aspect renders without error AND that
      # rendering is bit-deterministic. (Pixel-exact goldens can't be shared
      # across OSes — the committed PNGs are the macOS local visual reference.)
      - run: pnpm goldens
      - run: pnpm goldens:check
