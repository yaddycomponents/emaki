name: Release

# Manual trigger: Actions tab → Release → Run workflow → pick a dist-tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (beta | latest)'
        required: true
        default: 'beta'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no token needed once npm is configured
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm prefers OIDC (trusted publishing) when id-token:write is present;
      # falls back to NPM_TOKEN if a trusted publisher isn't configured yet.
      # Publishes every non-private @emaki/* package in dependency order,
      # rewriting workspace:* → the real version.
      - run: pnpm -r publish --access public --tag ${{ inputs.tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # While in beta, keep `latest` pointing at the newest beta too — otherwise
      # npm leaves `latest` stuck on the first-ever publish and the package page
      # (and plain `npm i`) show a stale version. Best-effort: never fail release.
      - name: Point latest at this beta
        if: ${{ inputs.tag == 'beta' }}
        continue-on-error: true
        run: |
          VER=$(node -p "require('./packages/schema/package.json').version")
          for p in schema core themes blocks extract render ui mcp cli; do
            npm dist-tag add @emaki/$p@$VER latest || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
